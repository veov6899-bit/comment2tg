name: comment2tg

# Сайтуудын шинэ сэтгэгдлийг Telegram суваг руу дамжуулна.
#
# ЯАГААД ИЙМ БҮТЭЦТЭЙ ВЭ:
# GitHub-ын "*/5 минут тутам" гэсэн хуваарь бодит байдалд найдваргүй (огт асахгүй байх нь бий).
# Тиймээс нэг ажиллагаа 58 минут үргэлжилж, ДОТРОО 5 минут тутам шалгадаг болгосон.
# Ингэснээр GitHub цагт ганц удаа асаахад л хангалттай — цагийн хуваарь илүү найдвартай болно.

on:
  schedule:
    - cron: "7 * * * *"        # цаг тутам (:07 минутад - оргил ачааллаас зайлсхийв)
  workflow_dispatch:            # гараар ажиллуулах товч

permissions:
  contents: write               # "уншсан" тэмдэглэгээг репод буцааж хадгалахын тулд

concurrency:
  group: comment2tg             # хоёр ажиллагаа зэрэг явж давхар илгээхээс сэргийлнэ
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Сангуудыг суулгах
        run: pip install -r requirements.txt

      - name: Git-ийн нэрийг тохируулах
        run: |
          git config user.name "comment2tg"
          git config user.email "actions@users.noreply.github.com"

      - name: Шинэ сэтгэгдлийг дамжуулах (58 минут, 5 минут тутам шалгана)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python forwarder.py --loop --max-runtime 58 --git-sync

      - name: Эцэст нь тэмдэглэгээг хадгалах
        if: always()
        run: |
          git add state
          if git diff --cached --quiet; then
            echo "өөрчлөлт алга"
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash
            git push
          fi
